name: roadmind-ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: roadmind-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Maven wrapper
        run: test -x ./mvnw

      - name: Run backend verification
        shell: bash
        run: |
          set -o pipefail
          ./mvnw -B -ntp verify 2>&1 | tee "$RUNNER_TEMP/roadmind-maven-verify.log"

      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roadmind-backend-diagnostics
          path: |
            ${{ runner.temp }}/roadmind-maven-verify.log
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: roadmind-web/package-lock.json

      - name: Install dependencies
        working-directory: roadmind-web
        run: npm ci

      - name: Run unit tests
        working-directory: roadmind-web
        run: npm run test -- --run

      - name: Type-check and build
        working-directory: roadmind-web
        run: npm run build

  evaluation:
    name: Offline agent evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile evaluation sources
        run: python -m compileall -q roadmind-evaluation

      - name: Run evaluation fixtures
        run: python roadmind-evaluation/run_evaluation.py --output "$RUNNER_TEMP/roadmind-evaluation.json"

      - name: Run evaluation tests
        run: python -m unittest discover -s roadmind-evaluation -p 'test_*.py'

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roadmind-evaluation-report
          path: ${{ runner.temp }}/roadmind-evaluation.json
          if-no-files-found: error

  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config > /dev/null

      - name: Scan tracked files for common secret formats
        shell: bash
        run: |
          if git grep -n -I -E '(sk|rk)-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC )?PRIVATE KEY-----'; then
            echo 'Potential secret detected in tracked files.'
            exit 1
          fi

      - name: Reject local handoff artifacts and personal paths
        shell: bash
        run: |
          forbidden_files=(
            design-qa.md
            README-TOTAL.md
            SHA256SUMS.txt
            docs/api-draft.md
            docs/database-design.md
            docs/development-plan.md
            docs/map-and-trip-design.md
            docs/requirements.md
            docs/security-design.md
          )

          for path in "${forbidden_files[@]}"; do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              echo "Stale, local-only, or generated artifact is tracked: $path"
              exit 1
            fi
          done

          tracked_artifacts="$(git ls-files | grep -E '^(qa-artifacts/|ui-reference/|docs/phase[^/]*-validation\.md$)' || true)"
          if [[ -n "$tracked_artifacts" ]]; then
            echo 'Local QA artifacts, design-reference dumps, or phase validation logs are tracked:'
            printf '%s\n' "$tracked_artifacts"
            exit 1
          fi

          if git grep -n -I -E '(^|[^[:alnum:]_])[A-Za-z]:\\|(^|[^[:alnum:]_])[A-Za-z]:/|/Users/[^/]+/|/home/[^/]+/|/tmp/|file:///|codex-clipboard' -- . ':!.github/workflows/ci.yml'; then
            echo 'An absolute workstation path or clipboard artifact reference is tracked.'
            exit 1
          fi
