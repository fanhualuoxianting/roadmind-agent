name: roadmind-agent

services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: UTC
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - roadmind-mysql-data:/var/lib/mysql
    networks:
      - roadmind-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:8.10.0
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: UTC
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - roadmind-redis-data:/data
    networks:
      - roadmind-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

networks:
  roadmind-network:
    name: roadmind-agent-network
    driver: bridge

volumes:
  roadmind-mysql-data:
    name: roadmind-agent-mysql-data
  roadmind-redis-data:
    name: roadmind-agent-redis-data
